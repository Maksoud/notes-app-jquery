<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Bloco de notas simples feito com jQuery, salvo no navegador.">
        <link rel="shortcut icon" href="./favicon.ico" type="image/x-icon">
        <title>Notes App</title>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.14.0/css/all.min.css">
        <link rel="stylesheet" href="./style.css">
    </head>
    <body>
        <header class="topo">
            <h1><i class="fas fa-sticky-note" aria-hidden="true"></i> Notas</h1>
            <button type="button" id="add">
                <i class="fas fa-plus" aria-hidden="true"></i> Nova nota
            </button>
        </header>

        <main>
            <div id="vazio" class="vazio" hidden>
                <p>Nenhuma nota ainda. Clique em <strong>Nova nota</strong> para começar.</p>
                <button type="button" id="exemplos">Carregar notas de exemplo</button>
            </div>
            <div id="notas" class="notas"></div>
        </main>

        <!-- Mensagens curtas para o usuário (lidas também por leitores de tela) -->
        <div id="aviso" class="aviso" role="status" aria-live="polite"></div>

        <footer class="rodape">
            Projeto de estudo de jQuery &middot; as notas ficam salvas só neste navegador
        </footer>

        <script src="./jquery-3.5.1.min.js"></script>
        <script src="./script.js"></script>
    </body>
</html>
